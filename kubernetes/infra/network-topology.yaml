# Definirea topologiei de retea - Retele virtuale distincte folosind Kubernetes NetworkPolicies

# 1. Politica pentru Public Net (Frontend UI, Kong Gateway)
# Regula: Expus public, permite preluarea de trafic extern (internet)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: public-net-policy
spec:
  podSelector:
    matchLabels:
      network: public-net
  policyTypes:
  - Ingress
  ingress:
  - {} # Permite tot traficul pe intrare

---
# 2. Politica pentru Internal Net (Auth Service, Main/Dispatcher Service)
# Regula: Accesibil exclusiv din reteaua "public-net" (prin Kong Gateway) si intern din "internal-net".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-net-policy
spec:
  podSelector:
    matchLabels:
      network: internal-net
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          network: public-net
    - podSelector:
        matchLabels:
          network: internal-net

---
# 3. Politica pentru Data Net (Data IO Service, Postgres DB, RabbitMQ)
# Regula: Retea complet izolata; permite trafic DOAR de la "internal-net" si traficul intern necesar sincronizarii bazei de date.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-net-policy
spec:
  podSelector:
    matchLabels:
      network: data-net
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          network: internal-net
    - podSelector:
        matchLabels:
          network: data-net
